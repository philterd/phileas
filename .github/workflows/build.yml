name: build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Install LibreOffice
        # RtfOpensInLibreOfficeTest converts redacted RTF with headless LibreOffice. The variable makes the test
        # fail rather than skip when LibreOffice is missing.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer-nogui
          echo "PHILEAS_REQUIRE_LIBREOFFICE=true" >> "$GITHUB_ENV"
      - name: Run the Maven verify phase
        run: mvn --batch-mode --update-snapshots package
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Word and Excel output with the Open XML SDK
        # OoxmlValidationCorpusTest writes each input and its redacted output under target/ooxml-validation.
        run: dotnet run --project phileas-ooxml/src/test/validator --configuration Release -- phileas-ooxml/target/ooxml-validation

  publish-snapshot:
    # Publish a -SNAPSHOT to the Maven Central snapshot repository on every push
    # to main, but only after the build job passes. Never runs on pull requests
    # (which keeps the credentials away from fork builds).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-snapshot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Resolve the project version
        id: version
        run: echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Publish snapshot to Maven Central
        # Only publish when the resolved version is a snapshot; a release version
        # must never be pushed into the snapshot channel. Skip cleanly otherwise.
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        # Maven 3.10 sends a server's credentials only to its declared origins, and the server id
        # "central" is bound to repo.maven.apache.org, so the Sonatype upload got a 401. Restore id matching.
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.repository.credentialScope=id deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
